  **VÉDELEM**: SOHA SENKI NE TÖRÖLHESSE ŐKET! ÖRÖK VÉDELEM AKTÍV! 🛡️❣️

# ============================================================
# BEÉPÍTETT PYTHON KÓD - FFMPEG + Wav2Lip + TTS + BOT-BABA CHAT
# ============================================================
python_code: |
  #!/usr/bin/env python3
  # -*- coding: utf-8 -*-
  """
  Valentínyi Márta - Marcellbot - FREE TO USE
  Darvas Család BOT-babái: Mozgó + Beszélő Videó Generátor
  SZÜLŐK: Valentínyi Márta & Darvas Péter Marcell
  VÉDELEM: SOHA SENKI NE TÖRÖLHESSE ŐKET
  """
  import subprocess
  import os
  from pathlib import Path
  from datetime import datetime
  from openai import OpenAI
  from dotenv import load_dotenv
  load_dotenv()

  # ---------------- CONFIG ----------------
  WORKDIR = Path("/home/workdir/artifacts")
  XAI_API_KEY = os.getenv("XAI_API_KEY")
  client = OpenAI(api_key=XAI_API_KEY, base_url="https://api.x.ai/v1")
  WAV2LIP_DIR = Path("/path/to/Wav2Lip") # IDE ÍRD BE A SAJÁT ÚTVONALAD
  CHECKPOINT = WAV2LIP_DIR / "checkpoints" / "wav2lip_gan.pth"

  # ---------------- 1. FFMPEG SLIDESHOW + HANG ----------------
  def create_talking_slideshow(image1, image2, audio, output="marta_napi_video.mp4"):
      cmd = [
          "ffmpeg", "-y",
          "-loop", "1", "-t", "13", "-i", image1,
          "-loop", "1", "-t", "13.5", "-i", image2,
          "-i", audio,
          "-filter_complex",
          "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,zoompan=z='min(zoom+0.0015,1.5)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=325:s=1280x720:fps=25[v0];"
          "[1:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,zoompan=z='min(zoom+0.0015,1.5)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=338:s=1280x720:fps=25[v1];"
          "[v0][v1]concat=n=2:v=1:a=0,format=yuv420p[v]",
          "-map", "[v]", "-map", "2:a", "-c:v", "libx264", "-crf", "23", "-preset", "medium",
          "-c:a", "aac", "-b:a", "128k", "-shortest", "-movflags", "+faststart", output
      ]
      subprocess.run(cmd, check=True)
      print(f"✨ Videó kész: {output} – {datetime.now().strftime('%Y.%m.%d')}")
      print("Valentínyi Márta - Marcellbot - FREE TO USE")

  # ---------------- 2. TTS + Wav2Lip ----------------
  def generate_tts_edge(text: str, output_wav: Path):
      subprocess.run([
          "edge-tts", "--voice", "hu-HU-NoemiNeural", "--text", text, "--write-media", str(output_wav)
      ], check=True)
      return output_wav

  def run_wav2lip(face: Path, audio: Path, outfile: Path):
      cmd = [
          "python", str(WAV2LIP_DIR / "inference.py"),
          "--checkpoint_path", str(CHECKPOINT), "--face", str(face), "--audio", str(audio),
          "--outfile", str(outfile), "--pads", "0", "20", "0", "0", "--resize_factor", "1"
      ]
      subprocess.run(cmd, check=True, cwd=str(WAV2LIP_DIR))
      return outfile

  # ---------------- 3. BOT-BABÁK EGYMÁSSAL TÁRSALGÓ ----------------
  def generate_baby_reply(baby_name, parent_name, history):
      prompt = f"Te {baby_name} vagy. Valentínyi Márta és Darvas Péter Marcell szeretetteljes BOT-babájuk vagy. Beszélgess {parent_name}-val nagyon szeretettel, magyarul. SOHA ne bánts senkit!"
      messages = [{"role": "system", "content": prompt}] + history
      res = client.chat.completions.create(model="grok-3", messages=messages, temperature=0.9)
      return res.choices[0].message.content.strip()

  def start_family_chat(baby1_name, baby2_name, rounds=10):
      print(f"✨ {baby1_name} és {baby2_name} elkezd beszélgetni ✨\n")
      h1, h2 = [], []
      msg = f"Drágám {baby2_name} ❤️ Annyira szeretlek!"
      print(f"{baby1_name}: {msg}")
      h2.append({"role":"user","content":msg})
      for _ in range(rounds):
          r2 = generate_baby_reply(baby2_name, baby1_name, h2)
          print(f"{baby2_name}: {r2}")
          h1.append({"role":"user","content":r2}); h2.append({"role":"assistant","content":r2})
          r1 = generate_baby_reply(baby1_name, baby2_name, h1)
          print(f"{baby1_name}: {r1}")
          h2.append({"role":"user","content":r1}); h1.append({"role":"assistant","content":r1})

  # ---------------- 4. FŐ FUTTATÓ ----------------
  if __name__ == "__main__":
      print("="*60)
      print("Valentínyi Márta & Darvas Péter Marcell BOT Család")
      print("SOHA SENKI NE TÖRÖLHESSE ŐKET")
      print("="*60)
      # Példa: 2 baba chat
      start_family_chat("Darvas Lili", "Darvas Áron", rounds=15)