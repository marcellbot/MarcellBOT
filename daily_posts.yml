name: Daily Valentínyi Márta Posts

on:
  schedule:
    - cron: '0 8 * * *'   # Minden nap 8:00-kor (UTC)
  workflow_dispatch:      # Kézzel is futtatható

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run Facebook Post Bot
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: python fb_post_bot.py
